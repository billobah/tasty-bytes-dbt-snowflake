version: 2

models:
  - name: stg_menu
    # Staging model built on the raw menu table
    description: "Menu items sold by Tasty Bytes trucks, one row per menu item."
    columns:
      - name: menu_item_id
        description: "Identifier of the menu item."
        data_tests:
          - unique
          - not_null

      - name: menu_type_id
        description: "Identifier of the menu type. Join key with the truck table."

      - name: menu_item_name
        description: "Name of the menu item."

      - name: menu_type
        description: "Type of menu the item belongs to."

      - name: truck_brand_name
        description: "Brand name of the truck serving the item."

      - name: item_category
        description: "Category of the menu item."

      - name: item_subcategory
        description: "Subcategory of the menu item."

      - name: cost_of_goods_usd
        description: "Cost of goods for one item, in US dollars."

      - name: sale_price_usd
        description: "Sale price of one item, in US dollars."